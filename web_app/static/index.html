<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Finance Tracker</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f6fa;
  padding:20px;
}

.cards{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.card{
  flex:1;
  padding:20px;
  border-radius:14px;
  color:#fff;
  text-align:center;
  min-width:200px;
}

.income{background:#2ecc71}
.expense{background:#e74c3c}
.result{background:#3498db}

button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  background:#eee;
}

button.active{
  background:#3498db;
  color:#fff;
}

hr{margin:30px 0}

.hidden{display:none}
</style>
</head>

<body>

<h2>📊 Joriy oy</h2>

<div class="cards">
  <div class="card income">
    <p>Kirim</p>
    <h2 id="income">0</h2>
  </div>
  <div class="card expense">
    <p>Chiqim</p>
    <h2 id="expense">0</h2>
  </div>
  <div class="card result">
    <p>Natija</p>
    <h2 id="result">0</h2>
  </div>
</div>

<h2 style="margin-top:30px">📈 12 oylik trend</h2>
<canvas id="trend"></canvas>

<hr>

<!-- NAV BUTTONS -->
<button id="btnExpenses" onclick="openPage('expenses')">💸 Harajatlar</button>
<button id="btnIncome" onclick="openPage('income')">💰 Kirimlar</button>

<!-- DETAILS PAGE -->
<div id="detailsPage" class="hidden">

  <h3 id="distributionTitle"></h3>

  <div style="margin:10px 0">
    <input type="date" id="from">
    <input type="date" id="to">
    <button onclick="loadPie()">Ko‘rsat</button>
  </div>

  <canvas id="pie"></canvas>
  <ul id="list"></ul>

</div>

<script>
/* ================= CONFIG ================= */
const API = "https://dottie-unbespoken-causatively.ngrok-free.dev";

/* ================= TELEGRAM ================= */
Telegram.WebApp.ready();
const user = Telegram.WebApp.initDataUnsafe.user;
if(!user){
  alert("Telegram user not found");
  throw new Error("Telegram user not found");
}
const UID = user.id;

/* ================= SUMMARY ================= */
fetch(`${API}/stats/summary/${UID}`)
.then(r=>r.json())
.then(d=>{
  income.innerText="$"+d.income;
  expense.innerText="$"+d.expense;
  result.innerText=(d.result>=0?"+":"-")+"$"+Math.abs(d.result);
});

/* ================= TREND ================= */
const trendChart=new Chart(trend,{
  type:"line",
  data:{
    labels:[],
    datasets:[
      {label:"Kirim",data:[]},
      {label:"Chiqim",data:[]}
    ]
  }
});

fetch(`${API}/stats/trend/${UID}`)
.then(r=>r.json())
.then(d=>{
  trendChart.data.labels=d.map(i=>i.month);
  trendChart.data.datasets[0].data=d.map(i=>i.income);
  trendChart.data.datasets[1].data=d.map(i=>i.expense);
  trendChart.update();
});

/* ================= DETAILS ================= */
let currentType = null;
let pieChart = null;

function openPage(type){
  currentType = type;

  // For now, keep details page hidden as requested
  detailsPage.classList.add("hidden");

  btnExpenses.classList.remove("active");
  btnIncome.classList.remove("active");

  if(type==="expenses"){
    btnExpenses.classList.add("active");
  }else{
    btnIncome.classList.add("active");
  }
}

function loadPie(){
  if(!from.value || !to.value){
    alert("Sanani tanlang");
    return;
  }

  let url = currentType==="expenses"
    ? `${API}/stats/expenses-pie/${UID}?date_from=${from.value}&date_to=${to.value}`
    : `${API}/stats/income-pie/${UID}?date_from=${from.value}&date_to=${to.value}`;

  fetch(url)
  .then(r=>r.json())
  .then(d=>{
    list.innerHTML="";
    d.forEach(i=>{
      list.innerHTML+=`<li>${i.source}: $${i.total}</li>`;
    });

    if(pieChart) pieChart.destroy();

    pieChart=new Chart(pie,{
      type:"pie",
      data:{
        labels:d.map(i=>i.source),
        datasets:[{
          data:d.map(i=>i.total),
          backgroundColor:d.map(_=>`hsl(${Math.random()*360},70%,60%)`)
        }]
      }
    });
  });
}
</script>

</body>
</html>
