<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen relative pb-20">

    <!-- PAGE: CATALOG -->
    <div id="catalogPage">
        <header class="p-4 flex justify-between items-center border-b sticky top-0 bg-white z-10">
            <h1 class="text-xl font-bold text-brown-800">☕ Coffee Market</h1>
            <button onclick="showPage('cartPage')" class="relative">
                <i class="fas fa-shopping-basket text-2xl text-blue-500"></i>
                <span id="cartBadge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </header>

        <div class="p-4">
            <div class="bg-gray-100 p-2 rounded-lg flex items-center mb-4">
                <i class="fas fa-search text-gray-400 mr-2"></i>
                <input type="text" placeholder="Qidirish..." class="bg-transparent outline-none w-full text-sm">
            </div>

            <div id="categoriesList" class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar">
                <!-- Categories will be loaded here -->
                <button onclick="filterProducts(null)" class="px-4 py-1 bg-blue-500 text-white rounded-full text-sm whitespace-nowrap">Hammasi</button>
            </div>

            <div id="productsGrid" class="grid grid-cols-2 gap-4 mt-4">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <!-- PAGE: CART -->
    <div id="cartPage" class="hidden">
        <header class="p-4 flex items-center border-b sticky top-0 bg-white z-10">
            <button onclick="showPage('catalogPage')"><i class="fas fa-arrow-left mr-4 text-blue-500"></i></button>
            <h1 class="text-xl font-bold">Sizning savatchangiz</h1>
        </header>

        <div id="cartItems" class="p-4 space-y-4">
            <!-- Cart items will be loaded here -->
        </div>

        <div id="cartSummary" class="p-4 border-t mt-4 hidden">
            <div class="flex justify-between mb-2">
                <span class="text-gray-500">Jami</span>
                <span id="subtotal">0 so'm</span>
            </div>
            <div class="flex justify-between mb-4">
                <span class="text-gray-500">Yetkazib berish</span>
                <span>10,000 so'm</span>
            </div>
            <div class="flex justify-between text-xl font-bold border-t pt-4">
                <span>Umumiy</span>
                <span id="totalPrice" class="text-blue-600">0 so'm</span>
            </div>
            <button onclick="showPage('checkoutPage')" class="w-full bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg mt-6">DAVOM ETISH</button>
        </div>

        <div id="emptyCart" class="p-10 text-center text-gray-400">
            <i class="fas fa-shopping-cart text-5xl mb-4"></i>
            <p>Savatchangiz bo'sh</p>
        </div>
    </div>

    <!-- PAGE: CHECKOUT -->
    <div id="checkoutPage" class="hidden">
        <header class="p-4 flex items-center border-b sticky top-0 bg-white z-10">
            <button onclick="showPage('cartPage')"><i class="fas fa-arrow-left mr-4 text-blue-500"></i></button>
            <h1 class="text-xl font-bold">Rasmiylashtirish</h1>
        </header>

        <div class="p-4 space-y-6">
            <div>
                <h3 class="font-bold text-gray-700 mb-3">Shaxsiy ma'lumotlar</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-500 ml-1">To'liq ism</label>
                        <input id="userName" type="text" placeholder="Ismingizni kiriting" class="w-full border rounded-xl p-3 text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 ml-1">Telefon raqami</label>
                        <input id="userPhone" type="text" placeholder="+998" class="w-full border rounded-xl p-3 text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 ml-1">Yetkazib berish manzili</label>
                        <textarea id="userAddress" placeholder="Manzilni kiriting" class="w-full border rounded-xl p-3 text-sm outline-none"></textarea>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="font-bold text-gray-700 mb-3">To'lov usuli</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectPayment('CLICK')" id="btnClick" class="border-2 border-blue-500 rounded-xl p-3 flex flex-col items-center bg-blue-50">
                        <span class="font-bold text-blue-600">CLICK</span>
                        <i class="fas fa-check-circle text-blue-500 mt-1"></i>
                    </button>
                    <button onclick="selectPayment('PAYME')" id="btnPayme" class="border rounded-xl p-3 flex flex-col items-center grayscale">
                        <span class="font-bold text-gray-400">PAYME</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="p-4 mt-4">
            <button onclick="submitOrder()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg uppercase">Tasdiqlash va To'lash</button>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-4 z-20">
        <button onclick="showPage('catalogPage')"><i id="navHome" class="fas fa-home text-blue-500"></i></button>
        <button onclick="showPage('historyPage')"><i id="navHistory" class="fas fa-history text-gray-400"></i></button>
        <button onclick="showPage('profilePage')"><i id="navProfile" class="fas fa-user text-gray-400"></i></button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 7583610226; // Fallback for testing
        const API_URL = window.location.origin + '/market';

        let cart = { items: [], id: null };
        let currentPayment = 'CLICK';

        // --- Core Functions ---

        async function init() {
            loadCategories();
            loadProducts();
            // Try to sync user info
            if (tg.initDataUnsafe?.user) {
                document.getElementById('userName').value = tg.initDataUnsafe.user.first_name + ' ' + (tg.initDataUnsafe.user.last_name || '');
            }
        }

        async function loadCategories() {
            const res = await fetch(`${API_URL}/categories`);
            const categories = await res.json();
            const list = document.getElementById('categoriesList');
            categories.forEach(cat => {
                if(!cat.father_id) { // Only top level for filter bar
                    const btn = document.createElement('button');
                    btn.className = 'px-4 py-1 bg-gray-200 text-gray-700 rounded-full text-sm whitespace-nowrap';
                    btn.innerText = cat.name;
                    btn.onclick = () => filterProducts(cat.id);
                    list.appendChild(btn);
                }
            });
        }

        async function loadProducts(catalogId = null) {
            let url = `${API_URL}/products`;
            if (catalogId) url += `?catalog_id=${catalogId}`;
            const res = await fetch(url);
            const products = await res.json();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border p-2">
                        <div class="h-24 bg-orange-100 rounded-lg mb-2 flex items-center justify-center">
                            <span class="text-4xl">${p.name.includes('Burger') ? '🍔' : '☕'}</span>
                        </div>
                        <h3 class="font-bold text-sm">${p.name}</h3>
                        <p class="text-xs text-gray-500">${p.description || ''}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="font-bold text-blue-600 text-sm">${Number(p.price).toLocaleString()} so'm</span>
                            <button onclick="addToCart(${p.id})" class="bg-blue-500 text-white p-1 px-2 rounded-lg text-xs">+</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addToCart(productId) {
            const res = await fetch(`${API_URL}/cart/${userId}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            cart = await res.json();
            updateCartUI();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const itemCount = cart.items.reduce((sum, item) => sum + item.quantity, 0);
            if (itemCount > 0) {
                badge.innerText = itemCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const cartItemsDiv = document.getElementById('cartItems');
            cartItemsDiv.innerHTML = '';
            let subtotal = 0;

            cart.items.forEach(item => {
                const price = Number(item.price);
                subtotal += price * item.quantity;
                cartItemsDiv.innerHTML += `
                    <div class="flex items-center space-x-4 border-b pb-4">
                        <div class="w-16 h-16 bg-orange-100 rounded-lg flex items-center justify-center text-2xl">☕</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">Mahsulot #${item.product_id}</h3>
                            <p class="text-blue-600 font-bold text-sm">${price.toLocaleString()} so'm</p>
                        </div>
                        <div class="flex items-center space-x-3 bg-gray-100 rounded-lg px-2 py-1">
                            <button class="text-blue-500 font-bold">-</button>
                            <span class="font-bold text-sm">${item.quantity}</span>
                            <button onclick="addToCart(${item.product_id})" class="text-blue-500 font-bold">+</button>
                        </div>
                    </div>
                `;
            });

            if (itemCount > 0) {
                document.getElementById('emptyCart').classList.add('hidden');
                document.getElementById('cartSummary').classList.remove('hidden');
                document.getElementById('subtotal').innerText = `${subtotal.toLocaleString()} so'm`;
                document.getElementById('totalPrice').innerText = `${(subtotal + 10000).toLocaleString()} so'm`;
                cart.total = subtotal + 10000;
            } else {
                document.getElementById('emptyCart').classList.remove('hidden');
                document.getElementById('cartSummary').classList.add('hidden');
            }
        }

        function showPage(pageId) {
            ['catalogPage', 'cartPage', 'checkoutPage'].forEach(p => {
                document.getElementById(p).classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');

            // Update nav icons
            const icons = { 'catalogPage': 'navHome', 'historyPage': 'navHistory', 'profilePage': 'navProfile' };
            Object.values(icons).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = el.className.replace('text-blue-500', 'text-gray-400');
            });
            if (icons[pageId]) {
                const active = document.getElementById(icons[pageId]);
                active.className = active.className.replace('text-gray-400', 'text-blue-500');
            }
        }

        function selectPayment(method) {
            currentPayment = method;
            const btnClick = document.getElementById('btnClick');
            const btnPayme = document.getElementById('btnPayme');
            if (method === 'CLICK') {
                btnClick.className = 'border-2 border-blue-500 rounded-xl p-3 flex flex-col items-center bg-blue-50';
                btnPayme.className = 'border rounded-xl p-3 flex flex-col items-center grayscale';
            } else {
                btnPayme.className = 'border-2 border-blue-500 rounded-xl p-3 flex flex-col items-center bg-blue-50';
                btnClick.className = 'border rounded-xl p-3 flex flex-col items-center grayscale';
            }
        }

        async function submitOrder() {
            const res = await fetch(`${API_URL}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cart_id: cart.id,
                    total_amount: cart.total
                })
            });
            const order = await res.json();
            tg.showAlert(`Buyurtma qabul qilindi! Buyurtma ID: ${order.id}`);
            tg.close();
        }

        function filterProducts(id) {
            loadProducts(id);
            // Update active state in category bar
            const btns = document.querySelectorAll('#categoriesList button');
            btns.forEach(btn => {
                btn.className = 'px-4 py-1 bg-gray-200 text-gray-700 rounded-full text-sm whitespace-nowrap';
            });
            event.target.className = 'px-4 py-1 bg-blue-500 text-white rounded-full text-sm whitespace-nowrap';
        }

        init();
    </script>
</body>
</html>
