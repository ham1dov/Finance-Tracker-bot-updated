<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Finance Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;background:#f5f6fa;padding:20px}
.cards{display:flex;gap:15px;flex-wrap:wrap}
.card{flex:1;padding:20px;border-radius:14px;color:#fff;text-align:center}
.income{background:#2ecc71}
.expense{background:#e74c3c}
.result{background:#3498db}
button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;margin:5px}
</style>
</head>
<body>

<h2>📊 Joriy oy</h2>
<div class="cards">
  <div class="card income"><p>Kirim</p><h2 id="income">0</h2></div>
  <div class="card expense"><p>Chiqim</p><h2 id="expense">0</h2></div>
  <div class="card result"><p>Natija</p><h2 id="result">0</h2></div>
</div>

<h2>📈 12 oylik trend</h2>
<canvas id="trend"></canvas>

<hr>
<div id="buttons">
  <button onclick="openPiePage('expenses')">💸 Harajatlar</button>
  <button onclick="openPiePage('income')">💰 Kirimlar</button>
</div>

<script>
const API="https://finance-tracker-bot-production-9206.up.railway.app";

// Telegram WebApp init
Telegram.WebApp.ready();
const user = Telegram.WebApp.initDataUnsafe.user;
if (!user) { alert("Telegram user not found"); throw new Error("Telegram user not found"); }
const UID = user.id;

// --- Monthly summary ---
fetch(`${API}/stats/summary/${UID}`)
.then(r=>r.json())
.then(d=>{
 income.innerText="$"+d.income;
 expense.innerText="$"+d.expense;
 result.innerText=(d.result>=0?"+":"-")+"$"+Math.abs(d.result);
});

// --- 12 month trend chart ---
const trendChart=new Chart(trend,{
 type:"line",
 data:{labels:[],datasets:[
  {label:"Kirim",borderColor:"#2ecc71",data:[]},
  {label:"Chiqim",borderColor:"#e74c3c",data:[]}
 ]},
 options:{responsive:true}
});

fetch(`${API}/stats/trend/${UID}`)
.then(r=>r.json())
.then(d=>{
 trendChart.data.labels=d.map(i=>i.month);
 trendChart.data.datasets[0].data=d.map(i=>i.income);
 trendChart.data.datasets[1].data=d.map(i=>i.expense);
 trendChart.update();
});

// --- Open Pie Chart Page ---
function openPiePage(type){
    const w = window.open("", "_blank", "width=600,height=600");
    w.document.write(`
        <html>
        <head>
        <title>${type==='expenses'?'Harajatlar':'Kirimlar'} Pie Chart</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        </head>
        <body>
        <h2>${type==='expenses'?'Harajatlar':'Kirimlar'} taqsimoti</h2>
        <input type="date" id="from">
        <input type="date" id="to">
        <button onclick="loadPie()">Ko‘rsat</button>
        <canvas id="pie"></canvas>
        <ul id="list"></ul>
        <script>
        const UID = ${UID};
        let pieChart;
        function loadPie(){
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            fetch(\`${API}/stats/${type}-pie/\${UID}?date_from=\${from}&date_to=\${to}\`)
            .then(r=>r.json())
            .then(d=>{
                const list = document.getElementById('list');
                list.innerHTML = "";
                d.forEach(i=>{ list.innerHTML += '<li>'+i.source+': $'+i.total+'</li>'; });
                const ctx = document.getElementById('pie');
                if(pieChart) pieChart.destroy();
                pieChart = new Chart(ctx,{
                    type:"pie",
                    data:{
                        labels: d.map(i=>i.source),
                        datasets:[{
                            data: d.map(i=>i.total),
                            backgroundColor:d.map(_=>`hsl(${Math.random()*360},70%,60%)`)
                        }]
                    },
                    options:{responsive:true}
                });
            });
        }
        </script>
        </body>
        </html>
    `);
}
</script>
</body>
</html>
