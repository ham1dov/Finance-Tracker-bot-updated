<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f6fa;
        margin: 0;
        padding: 20px;
    }
    .dashboard {
        max-width: 900px;
        margin: 0 auto;
    }
    .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }
    .card {
        flex: 1 1 200px;
        padding: 20px;
        border-radius: 12px;
        color: white;
        text-align: center;
        transition: transform 0.3s ease;
    }
    .card:hover { transform: scale(1.05); }
    .income { background-color: #2ecc71; }
    .expense { background-color: #e74c3c; }
    .result { background-color: #3498db; }
    .card h2 { margin: 10px 0 5px; font-size: 28px; }
    .card p { margin: 0; font-size: 18px; }
    canvas {
        background-color: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
    }
    .toggle-buttons {
        text-align: center;
        margin-bottom: 20px;
    }
    .toggle-buttons button {
        padding: 10px 20px;
        margin: 0 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
    }
    .toggle-buttons button.active {
        background-color: #3498db;
        color: white;
    }
    .filter {
        text-align: center;
        margin-bottom: 10px;
    }
    .filter input {
        padding: 5px;
        margin: 0 5px;
    }
    .expense-list {
        max-width: 600px;
        margin: 0 auto 40px;
        background: #ecf0f1;
        padding: 20px;
        border-radius: 12px;
    }
    .expense-list div {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 5px 10px;
        border-radius: 6px;
        transition: all 0.3s ease;
    }
    .expense-list div:hover {
        background-color: #dfe6e9;
    }
</style>
</head>
<body>
<div class="dashboard">
    <h1 style="text-align:center;">Joriy Oy Bo‘yicha - Bugungi Kungacha</h1>
    <div class="cards">
        <div class="card income">
            <p>Kirimlar</p>
            <h2 id="income">$1,800</h2>
        </div>
        <div class="card expense">
            <p>Harajatlar</p>
            <h2 id="expense">$1,250</h2>
        </div>
        <div class="card result">
            <p>Natija</p>
            <h2 id="result">+$550</h2>
        </div>
    </div>

    <h2 style="text-align:center;">Oxirgi 12 Oylik Trend</h2>
    <canvas id="trendChart" width="800" height="400"></canvas>

    <!-- Toggle buttons -->
    <div class="toggle-buttons">
        <button id="showIncome">Kirimlar</button>
        <button id="showExpense">Harajatlar</button>
    </div>

    <!-- Expense / Income Section -->
    <div id="detailSection" style="display:none;">
        <div class="filter">
            From: <input type="date" id="fromDate"> To: <input type="date" id="toDate">
            <button onclick="updatePieChart()">Filtrlash</button>
        </div>
        <canvas id="pieChart" width="400" height="400"></canvas>
        <div class="expense-list" id="expenseList"></div>
    </div>
</div>

<script>
    // Trend chart
    const ctx = document.getElementById('trendChart').getContext('2d');
    const trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr'],
            datasets: [
                {
                    label: 'Kirimlar',
                    data: [500, 650, 900, 1500, 700, 600, 1200, 700, 1100, 900, 2000, 1500],
                    borderColor: '#2ecc71',
                    backgroundColor: 'rgba(46, 204, 113, 0.2)',
                    tension: 0.3,
                    fill: true,
                },
                {
                    label: 'Harajatlar',
                    data: [300, 450, 600, 900, 550, 500, 750, 480, 700, 650, 1000, 720],
                    borderColor: '#e74c3c',
                    backgroundColor: 'rgba(231, 76, 60, 0.2)',
                    tension: 0.3,
                    fill: true,
                }
            ]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
    });

    // Dummy expense data
    let expenseData = [
        {type: 'Transport', amount: 250},
        {type: 'Food', amount: 400},
        {type: 'Rent', amount: 300},
        {type: 'Car', amount: 150},
        {type: 'Entertainment', amount: 150}
    ];

    const pieCtx = document.getElementById('pieChart').getContext('2d');
    let pieChart = new Chart(pieCtx, {
        type: 'pie',
        data: { labels: [], datasets: [{data: [], backgroundColor: []}] },
        options: {
            responsive: true,
            animation: { animateRotate: true, animateScale: true, duration: 1000 }
        }
    });

    const colors = ['#e74c3c','#f39c12','#9b59b6','#1abc9c','#34495e','#3498db'];
    const emojis = {
        'Transport': '🚗',
        'Food': '🍔',
        'Rent': '🏠',
        'Car': '🚘',
        'Entertainment': '🎮'
    };

    // Toggle buttons
    function showExpenseSection() {
        document.getElementById('detailSection').style.display = 'block';
        document.getElementById('showExpense').classList.add('active');
        document.getElementById('showIncome').classList.remove('active');
        updatePieChart();
    }

    document.getElementById('showExpense').addEventListener('click', showExpenseSection);

    function updatePieChart() {
        // Sort descending
        const sorted = expenseData.sort((a,b)=>b.amount - a.amount);
        pieChart.data.labels = sorted.map(e=>`${emojis[e.type] || ''} ${e.type}`);
        pieChart.data.datasets[0].data = sorted.map(e=>e.amount);
        pieChart.data.datasets[0].backgroundColor = colors.slice(0, sorted.length);
        pieChart.update();

        // Render list
        const list = document.getElementById('expenseList');
        list.innerHTML = '';
        sorted.forEach(e=>{
            const div = document.createElement('div');
            div.innerHTML = `<span>${emojis[e.type] || ''} ${e.type}</span><span>$${e.amount}</span>`;
            div.onmouseover = ()=>div.style.background="#dfe6e9";
            div.onmouseout = ()=>div.style.background="transparent";
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
